<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>순호의 유부남 전직 D-Day 카운트다운</title>
  <meta name="description" content="순호의 2027년 7월 10일 유부남 전직(결혼)을 축하하며 남은 시간을 실시간으로 카운트다운하는 모바일 웹입니다.">
  
  <!-- SEO & OpenGraph Meta Tags -->
  <meta property="og:title" content="순호의 유부남 전직 카운트다운">
  <meta property="og:description" content="2027년 7월 10일, 순호의 유부남 전직 퀘스트 완료까지 남은 시간!">
  <meta property="og:image" content="https://soonho-wedding.vercel.app/soonho.jpg">
  <meta property="og:url" content="https://soonho-wedding.vercel.app">
  <meta property="og:type" content="website">
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="rose">

  <!-- Interactive Particles Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Share Controls -->
  <div class="share-controls">
    <button id="share-btn" class="share-btn" aria-label="Share App" title="공유하기">
      <span class="share-icon">🔗</span>
      <span class="share-text">공유하기</span>
    </button>
  </div>

  <!-- Primary Centered Frame (Desktop container mockup, mobile full screen) -->
  <main class="phone-frame">
    <div class="phone-content">
      
      <!-- Hero Header Image -->
      <section class="hero-section" id="hero-sec">
        <div class="hero-image-wrapper">
          <img src="soonho.jpg" alt="순호 사진" class="hero-image" id="hero-img">
          <div class="hero-overlay"></div>
        </div>
        <div class="hero-text">
          <h1 class="wedding-title">Soonho will be MAN</h1>
          <p class="wedding-date">2027년 7월 10일 토요일</p>
        </div>
      </section>

      <!-- D-Day Badge & Counter -->
      <section class="counter-container">
        <div class="dday-display" id="dday-display">D-406</div>
        
        <div class="countdown-grid">
          <!-- Days Card -->
          <div class="countdown-card" id="card-days">
            <div class="card-number">000</div>
            <div class="card-label">일</div>
          </div>
          <!-- Hours Card -->
          <div class="countdown-card" id="card-hours">
            <div class="card-number">00</div>
            <div class="card-label">시간</div>
          </div>
          <!-- Minutes Card -->
          <div class="countdown-card" id="card-minutes">
            <div class="card-number">00</div>
            <div class="card-label">분</div>
          </div>
          <!-- Seconds Card -->
          <div class="countdown-card" id="card-seconds">
            <div class="card-number">00</div>
            <div class="card-label">초</div>
          </div>
        </div>
      </section>

      <!-- Interactive Progress Timeline -->
      <section class="progress-section">
        <h2 class="section-title">순호의 유부남 전직 게이지</h2>
        <div class="progress-bar-container">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-heart" id="progress-heart">❤️</div>
          </div>
        </div>
        <div class="progress-stats">
          <span class="start-point">전직 준비</span>
          <span class="precision-percentage" id="precision-percentage">0.000000%</span>
          <span class="end-point">유부남 전직</span>
        </div>
        <p class="progress-info-text">순호가 자유로운 영혼에서 유부남 클래스로<br/>완전히 각성하기까지</p>
      </section>

      <!-- Interactive Fireworks/Confetti Trigger -->
      <section class="celebrate-section">
        <button id="celebrate-btn" class="celebrate-button">
          <span class="btn-emoji">🎉</span> 순호의 유부남 전직<span class="btn-emoji">🎉</span>
</button>
      </section>



      <!-- Footer Info -->
      <footer class="app-footer">
        <p class="copyright">Soonho's Wedding D-Day Count © 2026</p>
      </footer>

    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast-notification" aria-live="polite"></div>

  <!-- Core Application Scripts -->
  <script src="app.js"></script>
</body>
</html>
